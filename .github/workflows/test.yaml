# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Test
on:
  workflow_call:
    inputs:
      git-ref:
        description: |
          The Git reference to operate on.
        type: string
        required: true
      upload-artifacts:
        description: |
          Whether to upload artifacts.

          Defaults to `true`.
        type: boolean
        required: false
        default: true
      artifact-retention-duration:
        description: |
          The length of time, in days, to retain uploaded artifacts for.

          If set to `0`, defaults to the value configured for the repository.

          Defaults to `0`.
        type: number
        required: false
        default: 0
    outputs:
      coverage-artifact-id:
        description: |
          The ID of the code coverage artifact generated by the workflow, if any.
        value: ${{jobs.test.outputs.coverage-artifact-name}}
      coverage-artifact-name:
        description: |
          The name of the code coverage artifact generated by the workflow, if any.
        value: ${{jobs.test.outputs.coverage-artifact-id}}
      coverage-artifact-url:
        description: |
          The download URL of the code coverage artifact generated by the workflow, if any.
        value: ${{jobs.test.outputs.coverage-artifact-url}}
      coverage-artifact-digest:
        description: |
          The digest of the code coverage artifact generated by the workflow, if any.
        value: ${{jobs.test.outputs.coverage-artifact-digest}}
    secrets:
      github-token:
        description: |
          The token to use for making authenticated requests to GitHub APIs.
        required: true
env:
  GITHUB_TOKEN: ${{secrets.github-token || secrets.GITHUB_TOKEN}}
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      #-- To clone the repository
      contents: read
    outputs:
      coverage-artifact-name: test-coverage-results
      coverage-artifact-id: ${{steps.upload-coverage-artifacts.outputs.artifact-id}}
      coverage-artifact-url: ${{steps.upload-coverage-artifacts.outputs.artifact-url}}
      coverage-artifact-digest: ${{steps.upload-coverage-artifacts.outputs.artifact-digest}}
      e2e-artifact-name: test-e2e-results
      e2e-artifact-id: ${{steps.upload-e2e-artifacts.outputs.artifact-id}}
      e2e-artifact-url: ${{steps.upload-e2e-artifacts.outputs.artifact-url}}
      e2e-artifact-digest: ${{steps.upload-e2e-artifacts.outputs.artifact-digest}}
    steps:
      - id: checkout-repository
        name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{inputs.git-ref}}
          lfs: true
          submodules: recursive
          show-progress: true
          token: ${{secrets.github-token || secrets.GITHUB_TOKEN}}
      - id: setup-pnpm
        name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false
      - id: setup-nodejs
        name: Setup NodeJS
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml
          token: ${{secrets.github-token || secrets.GITHUB_TOKEN}}
      - id: install-dependencies
        name: Install dependencies
        run: pnpm install
      - id: install-playwright
        name: Install Playwright
        run: pnpm exec playwright install
      - id: build
        name: Build
        run: pnpm run build:prod
      - id: test
        name: Test
        run: pnpm run test:ci
      - id: upload-coverage-artifacts
        name: Upload coverage artifacts
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: test-coverage-results
          path: ./coverage/
          retention-days: ${{inputs.artifact-retention-duration}}
          if-no-files-found: ignore
      - id: upload-e2e-artifacts
        name: Upload e2e artifacts
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: test-e2e-results
          path: ./playwright-report/
          retention-days: ${{inputs.artifact-retention-duration}}
          if-no-files-found: ignore
