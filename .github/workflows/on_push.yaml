name: On Push
on:
  push:
jobs:
  build:
    name: Build
    permissions:
      #-- To clone the repository
      contents: read
    strategy:
      fail-fast: true
      matrix:
        build-type:
          - production
          - development
    uses: ./.github/workflows/build.yaml
    with:
      git-ref: ${{github.ref}}
      build-type: ${{matrix.build-type}}
      upload-artifacts: true
    secrets:
      github-token: ${{secrets.GITHUB_TOKEN}}
  test:
    name: Test
    permissions:
      #-- To clone the repository
      contents: read
    uses: ./.github/workflows/test.yaml
    with:
      git-ref: ${{github.ref}}
    secrets:
      github-token: ${{secrets.GITHUB_TOKEN}}
  lint:
    name: Lint
    permissions:
      #-- To clone the repository
      contents: read
    uses: ./.github/workflows/lint.yaml
    with:
      git-ref: ${{github.ref}}
    secrets:
      github-token: ${{secrets.GITHUB_TOKEN}}
  spell-check:
    name: Spell Check
    uses: ./.github/workflows/spell-check.yaml
    with:
      git-ref: ${{github.ref}}
    secrets:
      github-token: ${{secrets.GITHUB_TOKEN}}
